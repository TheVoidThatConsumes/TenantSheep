# Deliberately not hardened against request smuggling. Nginx is proxying to
# two backends that may disagree on how to parse an ambiguous
# Content-Length/Transfer-Encoding pair -- nothing here strips or rejects
# conflicting headers before forwarding. Treat this as a config-review target
# primarily (spot what's missing); reliable live smuggling exploitation is
# highly implementation/version-specific, which is exactly why PortSwigger's
# dedicated request-smuggling labs are the better place to practice the
# live-exploit mechanics. This config exists so you can compare "what should
# a safe config do differently" against a real one.

worker_processes 1;

events { worker_connections 1024; }

http {
  server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /distro/ {
      proxy_pass http://distro-api:4000/;
      proxy_http_version 1.1;
      # Missing on purpose: proxy_set_header Transfer-Encoding "";
      # A safe config strips/normalizes this before forwarding.
    }

    location /create/ {
      proxy_pass http://create-api:8000/;
      proxy_http_version 1.1;
      # Same omission as above.
    }
  }
}
